services:
  - type: web
    name: carteira-financeira-git
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "gunicorn carteira_financeira.wsgi --log-file -"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: carteira-financeira-git.onrender.com
      # Preencha depois de criar o projeto na Vercel, com a URL final dele
      # (ex: https://carteira-financeira.vercel.app). Sem isso o login
      # quebra com erro 403 CSRF.
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # String de conexão do Postgres gratuito da Neon (neon.tech).
      - key: DATABASE_URL
        sync: false
      - key: BRAPI_TOKEN
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
