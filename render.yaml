services:
  - type: web
    name: carteira-financeira-git
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "gunicorn carteira_financeira.wsgi --log-file -"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: carteira-financeira-git.onrender.com
      # Preencha os dois com a URL final da Vercel (ex:
      # https://carteira-financeira.vercel.app) — sem isso o login/cadastro
      # quebra (CSRF 403 ou bloqueio de CORS no navegador).
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # String de conexão do Postgres gratuito da Neon (neon.tech).
      - key: DATABASE_URL
        sync: false
      - key: BRAPI_TOKEN
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
